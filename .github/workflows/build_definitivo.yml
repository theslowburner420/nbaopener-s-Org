name: Build Definitivo APK / AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: |
          npm install --legacy-peer-deps
          npm install -D @capacitor/cli@6 --legacy-peer-deps
          npm install @capacitor/core@6 @capacitor/android@6 --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android
