    <title>NBA Opener</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/K83yjb9c/Wvn-WDz-Es-400x400.jpg" />
    <meta name="description" content="The ultimate NBA card opening experience. Collect legends, build your dynasty, and dominate the court in NBA Opener." />

    <!-- Anti Click-Hijacking & Unauthorized Window.Open Interceptor Script -->
    <script>
      (function() {
        const originalOpen = window.open;
        let userInitiatedClick = false;

        document.addEventListener('click', () => {
          userInitiatedClick = true;
          setTimeout(() => { userInitiatedClick = false; }, 100);
        }, true);

        window.open = function(...args) {
          if (!userInitiatedClick) {
            console.warn('Blocked unauthorized popup attempt:', args);
            return null;
          }
          return originalOpen.apply(window, args);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
